<body>
<div class="app">
    <nav class="sidebar"><div class="brand"><h1>ЕГЭ 19<br>Наглядно</h1><p>Brutal-учебник: теория, MathML, визуальные модели, тренировка.</p><div class="progress-wrap"><div class="progress" id="progress"></div></div></div><div class="controls"><input id="search" class="input" placeholder="поиск по темам"><div class="row"><button class="btn" id="prevTop">назад</button><button class="btn" id="nextTop">вперёд</button></div><button class="btn" onclick="window.print()">печать / pdf</button></div><div class="nav-list" id="nav"></div></nav>

<script>
    const M={

        div:'<math display="block"><mrow><mi>a</mi><mo>|</mo><mi>b</mi><mo>⇔</mo><mi>b</mi><mo>=</mo><mi>a</mi><mi>k</mi></mrow></math>',
        mod:'<math display="block"><mrow><mi>n</mi><mo>=</mo><mi>m</mi><mi>k</mi><mo>+</mo><mi>r</mi><mo>,</mo><mspace width=".5em"/><mn>0</mn><mo>≤</mo><mi>r</mi><mo>&lt;</mo><mi>m</mi></mrow></math>',

        divisors:'<math display="block"><mrow><mi>d</mi><mo>(</mo><mi>n</mi><mo>)</mo><mo>=</mo><mo>(</mo><msub><mi>α</mi><mn>1</mn></msub><mo>+</mo><mn>1</mn><mo>)</mo><mo>…</mo><mo>(</mo><msub><mi>α</mi><mi>k</mi></msub><mo>+</mo><mn>1</mn><mo>)</mo></mrow></math>',
        fact:'<math display="block"><mrow><msub><mi>v</mi><mi>p</mi></msub><mo>(</mo><mi>n</mi><mo>!</mo><mo>)</mo><mo>=</mo><mo>⌊</mo><mfrac><mi>n</mi><mi>p</mi></mfrac><mo>⌋</mo><mo>+</mo><mo>⌊</mo><mfrac><mi>n</mi><msup><mi>p</mi><mn>2</mn></msup></mfrac><mo>⌋</mo><mo>+</mo><mo>…</mo></mrow></math>',
        sumk:'<math display="block"><mrow><mn>1</mn><mo>+</mo><mn>2</mn><mo>+</mo><mo>…</mo><mo>+</mo><mi>k</mi><mo>=</mo><mfrac><mrow><mi>k</mi><mo>(</mo><mi>k</mi><mo>+</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac></mrow></math>',
        ap:'<math display="block"><mrow><mi>a</mi><mo>−</mo><mn>2</mn><mi>d</mi><mo>,</mo><mi>a</mi><mo>−</mo><mi>d</mi><mo>,</mo><mi>a</mi><mo>,</mo><mi>a</mi><mo>+</mo><mi>d</mi><mo>,</mo><mi>a</mi><mo>+</mo><mn>2</mn><mi>d</mi></mrow></math>',
        gp:'<math display="block"><mrow><mi>u</mi><msup><mi>x</mi><mn>2</mn></msup><mo>,</mo><mi>u</mi><mi>x</mi><mi>y</mi><mo>,</mo><mi>u</mi><msup><mi>y</mi><mn>2</mn></msup></mrow></math>',
        dio:'<math display="block"><mrow><mi>x</mi><mi>y</mi><mo>−</mo><mi>a</mi><mi>x</mi><mo>−</mo><mi>b</mi><mi>y</mi><mo>=</mo><mi>c</mi><mo>⇒</mo><mo>(</mo><mi>x</mi><mo>−</mo><mi>b</mi><mo>)</mo><mo>(</mo><mi>y</mi><mo>−</mo><mi>a</mi><mo>)</mo><mo>=</mo><mi>c</mi><mo>+</mo><mi>a</mi><mi>b</mi></mrow></math>',
        diffsq:'<math display="block"><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mo>(</mo><mi>x</mi><mo>−</mo><mi>y</mi><mo>)</mo><mo>(</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>)</mo></mrow></math>',
        group:'<math display="block"><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mo>(</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>)</mo><mo>=</mo><mn>2</mn><mo>(</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>)</mo></mrow></math>'
    };
    const topics=[
        ['Стратегия решения','Пример, доказательство, оценка и проверка — четыре опоры задания 19.',['метод','пример','оценка'],['Задание проверяет доказательную культуру: важно не только получить число, но и объяснить, почему оно подходит или почему лучше нельзя.','Вопрос «может ли» требует примера или невозможности; «докажите» требует строгой цепочки; максимум и минимум требуют оценки и примера.','Полное решение оптимума состоит из двух частей: доказанная граница и конструкция, где граница достигается.'],[M.opt],['Определить тип вопроса.','Выписать ограничения.','Выбрать инструмент.','Построить пример или противоречие.','Проверить ответ.'],'На доске записаны 8 различных натуральных чисел. Их сумма 60. Найдите максимум наибольшего числа.',['Остальные семь чисел делаем минимальными.','1+2+3+4+5+6+7=28.','Наибольшее число не больше 60−28=32.','Пример: 1,2,3,4,5,6,7,32.'],'32',['Дать пример без оценки.','Забыть различность.','Не проверить сумму.'],['10 чисел, сумма 100 → максимум 55','12 чисел, сумма 120 → максимум 54','9 чисел, сумма 75; может ли быть 40? Нет']],
        ['Десятичная запись','Цифры превращаются в переменные, число — в сумму разрядов.',['цифры','разряды','произведение'],['Двузначные и трёхзначные числа надо сразу записывать через цифры.','Первая цифра многозначного числа не может быть нулём.','Если произведение цифр положительно, участвующие цифры ненулевые.','Разности с переставленными цифрами часто дают множитель 9 или 99.'],[M.ab,M.abc],'Обозначить цифры; записать число; составить уравнение; учесть ограничения; проверить.'.split('; '),'Найдите все трёхзначные числа, произведение цифр которых равно четверти самого числа.',['Пусть число 100a+10b+c.','4abc=100a+10b+c.','b,c не равны нулю.','Проверка цифр даёт 384.','3·8·4=96 и 384/4=96.'],'384',['Разрешить первую цифру 0.','Не проверить найденное число.','Потерять ограничение на цифры.'],['Двузначные: произведение цифр равно трети числа → 15, 24','Трёхзначные: произведение равно пятой части → 175','Трёхзначные: произведение равно восьмой части → 128, 672']],
        ['Чётность','Модуль 2 быстро доказывает невозможность.',['чётность','невозможность','инвариант'],['Чётное число имеет вид 2k, нечётное — 2k+1.','Сумма нечётна тогда и только тогда, когда нечётных слагаемых нечётное количество.','Произведение нечётно только если все множители нечётны.','Если сумма соседей нечётна, соседние числа имеют разную чётность.'],[M.parity],'Заменить числа на чётное/нечётное; проверить сумму или произведение; при последовательности проверить чередование; получить пример или противоречие.'.split('; '),'Можно ли записать 2025 натуральных чисел так, чтобы сумма соседних была нечётной, а первое и последнее имели одинаковую чётность?',['Соседи имеют разную чётность.','Чётности чередуются.','При 2025 числах первое и последнее места одной чётности.','Пример: 1,2,1,2,...,1.'],'Да',['Перепутать чётность номера и числа.','Не построить пример.','Считать, что нечётная сумма означает оба числа нечётные.'],['2024 числа с теми же условиями → нет','1001 число, первое и последнее нечётные → да','1000 чисел, первое и последнее чётные → нет']],
        ['Делимость и признаки','Признаки делимости сокращают перебор и помогают строить числа.',['делимость','признаки','цифры'],['a делит b, если b=ak для целого k.','Если a делит b и c, то a делит сумму и разность.','На 3 и 9 смотрим сумму цифр, на 4 — две последние цифры, на 8 — три последние.','Делимость на a и b даёт делимость на ab только при взаимной простоте.'],[M.div],'Выбрать делитель; разложить на удобные части; применить признаки; проверить цифры и различность.'.split('; '),'Найдите наибольшее четырёхзначное число с различными ненулевыми цифрами, делящееся на 9 и 4.',['Для 9 нужна сумма цифр, кратная 9.','Для 4 нужно окончание, кратное 4.','9612 подходит.','9+6+1+2=18, а 12 делится на 4.'],'9612',['Проверять делимость на 4 по последней цифре.','Забыть различность.','Забыть ненулевые цифры.'],['Делится на 9 и 5 → 9765','Минимум делится на 9 и 4 → 1368','Делится на 3 и 11 → 9867']],
        ['Остатки и сравнения','Большие числа заменяем маленькими остатками.',['остатки','mod','квадраты'],['Если n=mk+r и 0≤r<m, то r — остаток.','a≡b mod m означает, что a−b делится на m.','Сравнения можно складывать, вычитать и умножать.','Квадраты имеют мало возможных остатков.'],[M.mod,M.square],'Выбрать модуль; выписать остатки; перевести условия; объединить; проверить дополнительные ограничения.'.split('; '),'Найдите наименьшее трёхзначное число, которое при делении на 2,3,5 даёт остатки 1,2,3 и записано различными нечётными цифрами.',['Система даёт n≡23 mod 30.','Первые трёхзначные: 113,143,173.','113 имеет повтор, 143 содержит чётную цифру.','173 подходит.'],'173',['Считать остаток ответом.','Забыть условие про цифры.','Использовать остаток, равный делителю.'],['Условия 5→2, 3→1, нечётные цифры → 157','7→4, 9→5, окончание 3 → 473','4→3, 5→1, 3→2 → 251']],
        ['Простые множители','Квадраты, кубы и делители управляются показателями простых.',['простые','разложение','квадрат'],['Любое число больше 1 единственным образом раскладывается на простые множители.','Квадрат имеет чётные показатели простых.','Куб имеет показатели, кратные 3.','Для минимума домножаем только на недостающие множители.'],[M.square],'Разложить число; проверить показатели; сделать показатели чётными или кратными 3; домножить минимально.'.split('; '),'На что минимально умножить 18, чтобы получить квадрат?',['18=2·3².','Нечётный показатель только у двойки.','Домножаем на 2.','18·2=36.'],'2',['Считать 1 простым.','Домножать лишнее.','Проверить не все показатели.'],['50 до квадрата → 2','72 до квадрата → 2','12 до куба → 18']],
        ['НОД и НОК','Выносим общий делитель и работаем с взаимно простыми множителями.',['НОД','НОК','взаимная простота'],['НОД — наибольший общий делитель.','НОК — наименьшее общее кратное.','Произведение двух чисел равно произведению НОД и НОК.','Если НОД(a,b)=g, то a=gx, b=gy, где НОД(x,y)=1.'],[M.gcd],'Вынести НОД; потребовать взаимную простоту; записать НОК как gxy; перебрать делители.'.split('; '),'Найдите a<b, если НОД(a,b)=12 и НОК(a,b)=420.',['a=12x, b=12y.','НОД(x,y)=1.','12xy=420, xy=35.','Пары: (1,35), (5,7).'],'(12,420), (60,84)',['Забыть НОД(x,y)=1.','Не учесть a<b.','Взять невзаимно простые множители.'],['НОД=18, НОК=540 → 4 пары','НОД=15, НОК=900 → 4 пары','НОД=20, НОК=1260 → 2 пары']],
        ['Количество делителей','Считаем варианты показателей простых множителей.',['делители','показатели','минимум'],['Количество делителей равно произведению αᵢ+1.','Каждый делитель выбирает степень каждого простого.','Для минимального числа большие показатели ставят у меньших простых.','Нужно сравнивать все разложения количества делителей.'],[M.divisors],'Разложить число делителей; получить показатели; расставить по простым; сравнить кандидатов.'.split('; '),'Найдите наименьшее число с 12 делителями.',['12=12=6·2=4·3=3·2·2.','Кандидаты: 2¹¹, 2⁵·3, 2³·3², 2²·3·5.','Минимум 60.','60=2²·3·5 даёт 12 делителей.'],'60',['Проверить только одно разложение.','Поставить большой показатель у большого простого.','Не пересчитать делители.'],['8 делителей → 24','18 делителей → 180','10 делителей → 48']],
        ['Факториал','В n! показатели простых считаются слоями p, p², p³.',['факториал','степень','показатель'],['n! — произведение от 1 до n.','Кратные p дают один множитель p, кратные p² дают ещё один.','Для a^k надо сравнивать показатели простых из a.','Ответ — самое жёсткое ограничение.'],[M.fact],'Разложить основание; посчитать показатели в n!; составить ограничения; взять минимум.'.split('; '),'Найдите max k, при котором 20! делится на 12^k.',['12=2²·3.','v₂(20!)=10+5+2+1=18.','v₃(20!)=6+2=8.','2k≤18 и k≤8, значит k=8.'],'8',['Забыть p².','Не учесть степень простого в основании.','Взять максимум ограничений.'],['25! / 10^k → 6','30! / 18^k → 7','40! / 24^k → 12']],
        ['Оценка плюс пример','Главный метод максимумов и минимумов.',['оценка','пример','оптимум'],['Оценка доказывает, что лучше быть не может.','Пример доказывает достижимость.','Для разных натуральных минимальная сумма — 1+2+...+k.','Для двузначных минимальная сумма начинается с 10.'],[M.sumk,M.opt],'Понять, что оптимизируем; сделать остальные величины минимальными или максимальными; доказать границу; построить пример.'.split('; '),'12 различных натуральных чисел имеют сумму 100. Найдите максимум наибольшего.',['Остальные 11 чисел минимальны.','1+...+11=66.','Максимум равен 100−66=34.','Пример: 1,2,...,11,34.'],'34',['Использовать повторяющиеся числа.','Не дать пример.','Не доказать границу.'],['10 разных, сумма 80 → 35','15 разных, сумма 150; может ли быть 40? Да','9 разных, сумма 90 → 54']],
        ['Среднее арифметическое','Среднее сразу переводится в сумму.',['среднее','сумма','различность'],['Среднее равно сумме, делённой на количество.','Если среднее A у n чисел, сумма равна nA.','После удаления меняются и сумма, и количество.','Для максимума одного числа остальные делают минимальными.'],[M.sumk],'Перевести среднее в сумму; использовать минимум остальных; найти число; проверить среднее.'.split('; '),'Среднее десяти различных натуральных чисел равно 18. Найдите максимум наибольшего.',['Сумма равна 180.','Остальные 9 чисел минимальны: 1,...,9.','Их сумма 45.','Максимум 135.'],'135',['Не умножить среднее на количество.','Игнорировать различность.','Забыть проверить сумму.'],['8 разных, среднее 15 → 92','12 разных, среднее 20 → 174','7 разных, среднее 16 → 91']],
        ['Арифметическая прогрессия','Симметричная запись делает сумму прозрачной.',['арифметическая прогрессия','сумма','разность'],['В арифметической прогрессии разность соседних членов постоянна.','Нечётное число членов удобно писать вокруг среднего.','Сумма симметричных членов одинакова.','Первый член натуральной прогрессии должен быть положительным.'],[M.ap],'Записать симметрично; по сумме найти средний; потребовать положительность первого; найти max d.'.split('; '),'Пять различных натуральных чисел образуют АП, сумма 135. Найдите max d.',['Члены: a−2d,a−d,a,a+d,a+2d.','5a=135, значит a=27.','27−2d≥1, значит d≤13.','Пример: 1,14,27,40,53.'],'13',['Не использовать симметрию.','Забыть d≠0.','Не проверить первый член.'],['7 членов, сумма 154 → 7','5 членов, сумма 95 → 9','9 членов, сумма 225 → 6']],
        ['Геометрическая прогрессия','Натуральные члены требуют учёта рационального знаменателя.',['геометрическая прогрессия','натуральность','сумма'],['В геометрической прогрессии отношение соседних членов постоянно.','Три натуральных члена можно писать как ux²,uxy,uy².','Так учитывается рациональный знаменатель.','Для максимума проверяют делители суммы.'],[M.gp],'Записать ux²,uxy,uy²; использовать сумму; перебрать делители; выбрать максимум.'.split('; '),'Три различных натуральных числа в ГП имеют сумму 84. Найдите максимум наибольшего.',['Члены: ux²,uxy,uy².','u(x²+xy+y²)=84.','x=1,y=4 даёт 21, значит u=4.','Члены: 4,16,64.'],'64',['Рассмотреть только целый q.','Забыть x≠y.','Не проверить сумму.'],['Сумма 42 → 32','Сумма 156 → 96','Сумма 91 → 63']],
        ['Диофантовы уравнения','Целые решения ищутся через множители.',['диофантовы','множители','целые'],['Диофантово уравнение ищется в целых или натуральных числах.','Линейное ax+by=c имеет целые решения, если НОД(a,b) делит c.','xy−ax−by=c часто превращается в произведение.','Каждый вариант надо проверить подстановкой.'],[M.dio],'Добавить число для произведения; разложить правую часть; перебрать делители; найти x,y.'.split('; '),'Решите xy−3x−2y=7 в натуральных числах.',['Добавим 6.','xy−3x−2y+6=13.','(x−2)(y−3)=13.','Ответ: (3,16), (15,4).'],'(3,16), (15,4)',['Неверно добавить число.','Потерять пару делителей.','Не проверить натуральность.'],['xy−4x−3y=12 → 8 пар','xy−5x−2y=10 → 6 пар','xy−6x−5y=30 → 12 пар']],
        ['Разность квадратов','Квадратная задача распадается на два множителя.',['квадраты','делители','чётность'],['x²−y² раскладывается как (x−y)(x+y).','Множители имеют одинаковую чётность.','Подходят только пары делителей одной чётности.','Если разность положительна, x>y.'],[M.diffsq],'Разложить; перебрать пары делителей; оставить пары одной чётности; решить системы.'.split('; '),'Найдите натуральные пары (x,y), если x²−y²=45.',['(x−y)(x+y)=45.','Пары: 1·45,3·15,5·9.','Решаем системы.','Получаем (23,22),(9,6),(7,2).'],'(23,22), (9,6), (7,2)',['Брать пары разной чётности.','Забыть x>y.','Не решить систему.'],['x²−y²=63 → 3 пары','x²−y²=80 → 3 пары','x²−y²=105 → 4 пары']],
        ['Принцип Дирихле','Если объектов больше, чем ящиков, где-то будет тесно.',['Дирихле','остатки','существование'],['Если n+1 объект распределён по n ящикам, в одном ящике хотя бы два объекта.','Ящиками часто служат остатки, чётность, последние цифры или цвета.','После применения принципа надо объяснить арифметический смысл.','Усиленная версия даёт минимум ceil(N/n).'],[M.mod],'Назвать объекты; назвать ящики; сравнить количество; сделать вывод.'.split('; '),'Докажите, что среди любых 11 целых чисел есть два, разность которых делится на 10.',['Остатков при делении на 10 всего 10.','Чисел 11.','Два имеют одинаковый остаток.','Их разность делится на 10.'],'Доказано',['Не назвать ящики.','Не объяснить разность.','Выбрать неверные классы.'],['13 чисел → разность делится на 12','8 чисел → разность делится на 7','101 число → разность делится на 100']],
        ['Инварианты','Ищем то, что сохраняется при каждом ходе.',['инвариант','операции','невозможность'],['Инвариант — свойство, которое не меняется при операции.','Частые инварианты: чётность суммы, остаток суммы, цвет клетки.','Если финал противоречит инварианту, переход невозможен.','Иногда вместо инварианта работает монотонность.'],[M.parity],'Изучить операцию; проверить сумму, чётность, остаток; найти сохраняемое свойство; сравнить старт и финиш.'.split('; '),'На доске 1,2,...,2025. За ход стирают два числа и пишут модуль разности. Докажите, что последнее число нечётно.',['При замене a≥b на a−b сумма уменьшается на 2b.','Чётность суммы сохраняется.','Начальная сумма 2025·1013 нечётна.','Последнее число нечётно.'],'Нечётное',['Проверить один пример вместо общего хода.','Перепутать сумму и чётность суммы.','Не сравнить финал.'],['1,...,1000 → чётное','1,...,101; операция суммы → нечётное','1,...,99 → чётное']],
        ['Рекуррентные последовательности','Ищем период остатков, а не считаем огромные члены.',['рекурсия','период','остатки'],['Рекурсия задаёт следующий член через предыдущие.','Остатки подчиняются той же рекурсии по модулю.','Для рекурсии второго порядка повтор пары остатков даёт период.','Это помогает доказывать делимость больших членов.'],[M.mod],'Выбрать модуль; выписать остатки; найти период; определить нужные члены.'.split('; '),'a₁=1, a₂=1, aₙ₊₂=aₙ₊₁+aₙ. Докажите, что a₅+a₁₀+a₁₅ делится на 2.',['Остатки по модулю 2: 1,1,0,1,1,0,...','Период 3.','a₅ и a₁₀ нечётные, a₁₅ чётный.','Сумма чётна.'],'Делится на 2',['Считать все члены.','Не доказать период.','Перепутать индекс и остаток члена.'],['a₄+a₈+a₁₂ → делится','a₇+a₁₄+a₂₁ → чётное','a₆+a₉+a₁₂ → делится']],
        ['Разбиение на группы','Суммы групп, чётность и запрет повторов.',['разбиение','группы','сумма'],['Сумма всех чисел равна сумме сумм групп.','Тройка x,y,x+y имеет чётную сумму.','Если все тройки такие, общая сумма должна быть чётной.','Чётная сумма не гарантирует существование разбиения.'],[M.group],'Найти общую сумму; проверить чётность групп; если нарушено — невозможность; иначе строить пример или искать сильнее.'.split('; '),'Можно ли числа 1,...,9 разбить на три тройки, чтобы в каждой одно число равнялось сумме двух других?',['Сумма 1+...+9=45.','Каждая тройка вида x,y,x+y имеет чётную сумму.','Сумма трёх таких групп должна быть чётной.','45 нечётно — противоречие.'],'Нет',['Повторить число.','Использовать число вне набора.','Считать чётную сумму достаточной.'],['1,...,6 → нет','1,...,9 → нет','1,...,11 → нет, количество не делится на 3']]
    ];
    function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
    function arr(x){return Array.isArray(x)?x:[x]}
    function renderTopic(t,i){let [title,sub,tags,theory,formulas,alg,problem,solution,answer,mistakes,training]=t;return `<section class="page" data-title="${esc(title)}"><div class="page-head"><span class="page-num">страница ${i}</span><h2>${esc(title)}</h2><p>${esc(sub)}</p><div class="tag-row">${tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><div class="layout"><div class="maincol"><article class="card"><div class="stamp">теория</div><h3>Что нужно знать</h3>${theory.map(x=>`<div class="note"><h4>${esc(x.split('.')[0])}</h4><p>${esc(x)}</p></div>`).join('')}</article><article class="card"><div class="stamp cyan">mathml</div><h3>Формулы и опорные записи</h3>${formulas.map(f=>`<div class="math-block">${f}</div>`).join('')}</article><article class="card"><div class="stamp yellow">алгоритм</div><h3>Как действовать</h3><div class="steps">${arr(alg).map(x=>`<div class="step">${esc(x)}</div>`).join('')}</div></article><article class="card"><div class="stamp pink">прототип</div><h3>Разбор задачи</h3><div class="problem">${esc(problem)}</div><h4>Решение</h4>${solution.map((x,j)=>`<div class="solve-step"><b>${j+1}.</b> ${esc(x)}</div>`).join('')}<div class="answer-box"><b>Ответ:</b> ${esc(answer)}</div></article></div><aside class="sidecol"><div class="sticky-stack"><article class="card"><div class="stamp green">наглядно</div><h3>Модель идеи</h3><svg viewBox="0 0 640 320" class="svg-board"><rect x="24" y="28" width="592" height="250" fill="#fffaf0" stroke="#101010" stroke-width="5"/><line x1="70" y1="215" x2="570" y2="215" stroke="#101010" stroke-width="5"/><circle cx="145" cy="215" r="25" fill="#d7ff00" stroke="#101010" stroke-width="5"/><circle cx="270" cy="215" r="25" fill="#00e5ff" stroke="#101010" stroke-width="5"/><circle cx="395" cy="215" r="25" fill="#ff4fa3" stroke="#101010" stroke-width="5"/><circle cx="520" cy="215" r="25" fill="#ff8c00" stroke="#101010" stroke-width="5"/><text x="320" y="82" text-anchor="middle" font-size="28" font-weight="900" font-family="Arial">условие → метод → пример → проверка</text><text x="145" y="222" text-anchor="middle" font-size="18" font-weight="900">1</text><text x="270" y="222" text-anchor="middle" font-size="18" font-weight="900">2</text><text x="395" y="222" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">3</text><text x="520" y="222" text-anchor="middle" font-size="18" font-weight="900">4</text></svg></article><article class="card"><div class="stamp orange">ловушки</div><h3>Типичные ошибки</h3><ul>${mistakes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article><article class="card"><div class="stamp purple">тренировка</div><h3>Похожие задания</h3>${training.map((x,j)=>`<div class="task"><b>${j+1}.</b> ${esc(x)}<button class="btn reveal" type="button">ответ</button><div class="answer">${esc(x.split('→').pop().trim())}</div></div>`).join('')}</article></div></aside></div></section>`}
    const main=document.getElementById('main');const nav=document.getElementById('nav');main.innerHTML=`<section class="page hero active" data-title="Обложка"><div><span class="kicker">профильная математика • задание 19</span><h2>Прототипы 19 в формате Наглядная математика</h2><p class="lead">Каждая страница устроена как полноценный учебный модуль: теория, формулы в MathML, алгоритм, прототип, решение, проверка, ловушки, тренировка и визуальная модель.</p><div class="stats"><div class="stat"><b>${topics.length}</b> тем</div><div class="stat"><b>54</b> упражнений</div><div class="stat"><b>MathML</b> формулы</div><div class="stat"><b>zero CDN</b> автономно</div></div></div></section>`+topics.map((t,i)=>renderTopic(t,i+1)).join('')+`<section class="page" data-title="Квиз и сводка"><div class="page-head"><span class="page-num">финал</span><h2>Квиз и итоговая сводка</h2><p>Проверка ключевых идей по всем страницам.</p></div><div class="layout"><div class="maincol"><article class="card"><div class="stamp pink">квиз</div><h3>Самопроверка</h3><div id="quiz"></div></article><article class="card"><div class="stamp cyan">сводка</div><h3>Карта методов</h3><div class="note"><h4>Цифры</h4><p>Сразу писать число через разряды.</p></div><div class="note"><h4>Остатки</h4><p>Если есть делимость, квадрат или невозможность — пробовать модуль.</p></div><div class="note"><h4>Оптимум</h4><p>Ответ состоит из оценки и примера.</p></div><div class="note"><h4>Инвариант</h4><p>При операциях искать сохраняемую чётность, остаток или сумму.</p></div></article></div><aside><div class="sticky-stack"><article class="card"><div class="stamp green">чек-лист</div><h3>Перед ответом</h3><ul><li>Все ограничения учтены?</li><li>Пример проверен?</li><li>Оценка доказана?</li><li>Ответ подставлен?</li></ul></article><article class="card"><div class="stamp orange">инструменты</div><h3>Мини-калькулятор</h3><div class="tool-grid"><input class="input" id="factorN" value="360"><input class="input" id="divisorN" value="60"><button class="btn" onclick="factorize()">разложить</button><button class="btn" onclick="countDivisors()">делители</button></div><div class="result" id="toolResult">Введите числа и нажмите кнопку.</div></article></div></aside></div></section><div class="pager"><button class="btn" id="prevBottom">← назад</button><button class="btn" id="nextBottom">вперёд →</button></div>`;
    nav.innerHTML='<button class="nav-btn active" data-title="обложка" onclick="showPage(0)">0. Обложка</button>'+topics.map((t,i)=>`<button class="nav-btn" data-title="${esc(t[0].toLowerCase())}" onclick="showPage(${i+1})">${i+1}. ${esc(t[0])}</button>`).join('')+`<button class="nav-btn" data-title="квиз сводка" onclick="showPage(${topics.length+1})">${topics.length+1}. Квиз и сводка</button>`;
    let pages=[...document.querySelectorAll('.page')], current=0;function showPage(i){current=Math.max(0,Math.min(pages.length-1,i));pages.forEach((p,idx)=>p.classList.toggle('active',idx===current));document.querySelectorAll('.nav-btn').forEach((b,idx)=>b.classList.toggle('active',idx===current));document.getElementById('progress').style.width=(current/(pages.length-1)*100)+'%';scrollTo({top:0,behavior:'smooth'});wireReveals()}function next(){showPage(current+1)}function prev(){showPage(current-1)}document.getElementById('nextTop').onclick=next;document.getElementById('prevTop').onclick=prev;document.addEventListener('click',e=>{if(e.target.id==='nextBottom')next();if(e.target.id==='prevBottom')prev()});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.nav-btn').forEach(b=>b.style.display=b.dataset.title.includes(q)?'':'none')});function wireReveals(){document.querySelectorAll('.reveal').forEach(btn=>{btn.onclick=()=>btn.parentElement.querySelector('.answer').classList.toggle('show')})}wireReveals();
    function primeFactorObj(n){n=Math.abs(Math.floor(Number(n)));const res={};let d=2;if(n<2)return res;while(d*d<=n){while(n%d===0){res[d]=(res[d]||0)+1;n/=d}d+=d===2?1:2}if(n>1)res[n]=(res[n]||0)+1;return res}function factorize(){const n=document.getElementById('factorN').value;const f=primeFactorObj(n);const parts=Object.entries(f).map(([p,a])=>a==1?p:`${p}<sup>${a}</sup>`);document.getElementById('toolResult').innerHTML=parts.length?`${n} = ${parts.join(' · ')}`:'Введите число больше 1'}function countDivisors(){const n=document.getElementById('divisorN').value;const f=primeFactorObj(n);const c=Object.values(f).reduce((a,b)=>a*(b+1),1);document.getElementById('toolResult').innerHTML=`Количество делителей: <b>${c}</b>`}
    const quizData=[['Что нужно для минимума?',['Только пример','Оценка и пример','Только ответ'],1],['Что означает a≡b mod m?',['a=b','a−b делится на m','a+b делится на m'],1],['Если НОД(a,b)=g, то после a=gx,b=gy:',['x=y','НОД(x,y)=1','xy=g'],1],['Квадрат имеет:',['чётные показатели','любые показатели','нечётную сумму показателей'],0],['Инвариант сохраняется:',['иногда','на каждом ходе','только в конце'],1]];const quiz=document.getElementById('quiz');quizData.forEach((it,idx)=>{const box=document.createElement('div');box.className='quiz-item';box.innerHTML='<b>'+(idx+1)+'. '+it[0]+'</b>';it[1].forEach((txt,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=txt;b.onclick=()=>{box.querySelectorAll('.choice').forEach((x,j)=>{x.classList.toggle('correct',j===it[2]);if(j===i&&j!==it[2])x.classList.add('wrong')})};box.appendChild(b)});quiz.appendChild(box)});showPage(0);
</script>
